# This is a Databricks asset bundle definition for DAB_PROJECT.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DAB_PROJECT
  uuid: ea569331-7b9a-4db2-8e4a-c6f04ef7f111


include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-692681e5-9882.cloud.databricks.com/

  prod:
    mode: production
    workspace:
      host: https://dbc-692681e5-9882.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/warrier090@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/warrier090@gmail.com/PRODD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
